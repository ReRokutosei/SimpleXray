name: Verify

permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
  pull_request:
    branches: [ main, dev ]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        submodules: recursive

    - name: Check Version Consistency
      run: python3 tools/sync_versions.py --check

    - name: Read Go version
      run: |
        GO_VERSION="$(grep '^GO_VERSION=' version.properties | cut -d '=' -f 2 | tr -d '\r ')"
        if [[ ! "$GO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid GO_VERSION: $GO_VERSION" >&2
          exit 1
        fi
        echo "GO_VERSION=$GO_VERSION" >> "$GITHUB_ENV"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Check Go formatting
      run: |
        unformatted="$(gofmt -l tools)"
        if [ -n "$unformatted" ]; then
          echo "The following Go files are not gofmt-formatted:" >&2
          echo "$unformatted" >&2
          exit 1
        fi

    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: gradle

    - name: Set up Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.16.0

    - name: Build simpletun
      run: |
        cd third_party/simpletun
        zig build android

    - name: Test simpletun
      run: |
        cd third_party/simpletun
        zig build test

    - name: Build and Test with Gradle
      run: bash ./gradlew testDebugUnitTest assembleDebug
