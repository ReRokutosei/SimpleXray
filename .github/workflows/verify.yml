name: Verify

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
  pull_request:
    branches: [ main, dev ]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: gradle

    - name: Set up Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Build zeptun
      run: |
        cd third_party/zeptun
        ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" zig build android -Doptimize=ReleaseSmall

    - name: Build and Test with Gradle
      run: bash ./gradlew testDebugUnitTest assembleDebug
