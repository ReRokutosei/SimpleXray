name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ci-release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Read Versions
        run: |
          echo "XRAY_VERSION=$(grep 'XRAY_CORE_VERSION' version.properties | cut -d '=' -f 2 | tr -d '\r ')" >> $GITHUB_ENV
          echo "GO_VERSION=$(grep 'GO_VERSION' version.properties | cut -d '=' -f 2 | tr -d '\r ')" >> $GITHUB_ENV
          RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          # Validate the tag as a semver-like release tag before it is used in
          # shell commands below (guards against tag-name command injection).
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid release tag: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Download Rules Files
        run: |
          mkdir -p ./app/src/main/assets/
          wget https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat -O ./app/src/main/assets/geoip.dat
          wget https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat -O ./app/src/main/assets/geosite.dat

      - name: Build Xray-core from Source
        run: |
          wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          NDK_HOME=$(realpath android-ndk-*)

          # Shallow-clone the exact tag: a plain --depth=1 clone of the default
          # branch does not fetch any tags, so `git checkout <tag>` would fail
          # (pathspec did not match). --branch accepts a tag and checks it out.
          git clone --depth=1 --branch ${{ env.XRAY_VERSION }} https://github.com/XTLS/Xray-core.git
          cd Xray-core
          COMMID=$(git rev-parse HEAD | cut -c 1-7)

          export GOOS=android
          export CGO_ENABLED=1
          export GOARCH=arm64
          export CC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          # -checklinkname=0: wlynxg/anet still linknames net internal symbols
          # (net.zoneCache), which Go 1.26's strict check rejects. Xray's own
          # release workflow uses the same flag for Android builds.
          go build -o xray -trimpath -buildvcs=false -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid= -checklinkname=0" -v ./main
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          mv xray ../app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Set up signing keystore
        run: |
          [ -n "${{ secrets.SIGNING_KEY }}" ] || { echo "SIGNING_KEY secret is not set" >&2; exit 1; }
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks

      - name: Build release APK
        run: bash ./gradlew assembleRelease -x lint -PappVerName=${{ env.RELEASE_VERSION }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/simplexray-arm64-v8a.apk SimpleXray-arm64-v8a-${{ env.RELEASE_VERSION }}.apk

      - name: Generate release notes
        shell: bash
        run: |
          CURRENT_TAG="${RELEASE_VERSION}"
          # No previous tag on first release: grep exits 1 on no match, which
          # pipefail turns into a step failure. `|| true` keeps PREV_TAG empty
          # so the script falls back to a single-tag range.
          PREV_TAG="$(git tag --sort=-v:refname | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)"
          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="$PREV_TAG...$CURRENT_TAG"
          fi
          bash .github/scripts/gen_release_notes.sh -r "$RANGE" -o release.md

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          draft: false
          generate_release_notes: false
          body_path: release.md
          files: |
            SimpleXray-arm64-v8a-${{ env.RELEASE_VERSION }}.apk
