name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ci-release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Read Versions
        run: |
          XRAY_VERSION="$(grep 'XRAY_CORE_VERSION' version.properties | cut -d '=' -f 2 | tr -d '\r ')"
          if [[ ! "$XRAY_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid XRAY_CORE_VERSION: $XRAY_VERSION" >&2
            exit 1
          fi
          echo "XRAY_VERSION=$XRAY_VERSION" >> "$GITHUB_ENV"

          GO_VERSION="$(grep 'GO_VERSION' version.properties | cut -d '=' -f 2 | tr -d '\r ')"
          if [[ ! "$GO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid GO_VERSION: $GO_VERSION" >&2
            exit 1
          fi
          echo "GO_VERSION=$GO_VERSION" >> "$GITHUB_ENV"

          XRAY_CORE_COMMIT="$(grep '^XRAY_CORE_COMMIT=' version.properties | cut -d '=' -f 2 | tr -d '\r ')"
          if [[ ! "$XRAY_CORE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid XRAY_CORE_COMMIT: $XRAY_CORE_COMMIT" >&2
            exit 1
          fi
          echo "XRAY_CORE_COMMIT=$XRAY_CORE_COMMIT" >> "$GITHUB_ENV"

          GEOIP_SHA256="$(grep '^GEOIP_SHA256=' version.properties | cut -d '=' -f 2 | tr -d '\r ')"
          if [[ ! "$GEOIP_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid GEOIP_SHA256: $GEOIP_SHA256" >&2
            exit 1
          fi
          echo "GEOIP_SHA256=$GEOIP_SHA256" >> "$GITHUB_ENV"

          GEOSITE_SHA256="$(grep '^GEOSITE_SHA256=' version.properties | cut -d '=' -f 2 | tr -d '\r ')"
          if [[ ! "$GEOSITE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid GEOSITE_SHA256: $GEOSITE_SHA256" >&2
            exit 1
          fi
          echo "GEOSITE_SHA256=$GEOSITE_SHA256" >> "$GITHUB_ENV"

          RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          # Validate the tag as a semver-like release tag before it is used in
          # shell commands below (guards against tag-name command injection).
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check Version Consistency
        run: python3 tools/sync_versions.py --check

      - name: Download Rules Files
        run: |
          mkdir -p ./app/src/main/assets/
          wget https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat -O ./app/src/main/assets/geoip.dat
          echo "$GEOIP_SHA256  ./app/src/main/assets/geoip.dat" | sha256sum -c -
          wget https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat -O ./app/src/main/assets/geosite.dat
          echo "$GEOSITE_SHA256  ./app/src/main/assets/geosite.dat" | sha256sum -c -

      - name: Build Xray-core from Source
        run: |
          wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          NDK_HOME=$(realpath android-ndk-*)
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

          # Shallow-clone the exact tag: a plain --depth=1 clone of the default
          # branch does not fetch any tags, so `git checkout <tag>` would fail
          # (pathspec did not match). --branch accepts a tag and checks it out.
          git clone --depth=1 --branch "${{ env.XRAY_VERSION }}" https://github.com/XTLS/Xray-core.git
          cd Xray-core
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_COMMIT" != "$XRAY_CORE_COMMIT" ]]; then
            echo "Xray-core $XRAY_VERSION resolved to $ACTUAL_COMMIT, expected $XRAY_CORE_COMMIT" >&2
            exit 1
          fi
          COMMID="$(git rev-parse --short=7 HEAD)"

          export GOOS=android
          export CGO_ENABLED=1
          export GOARCH=arm64
          export CC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          # -checklinkname=0: wlynxg/anet still linknames net internal symbols
          # (net.zoneCache), which Go 1.26's strict check rejects. Xray's own
          # release workflow uses the same flag for Android builds.
          go build -o xray -trimpath -buildvcs=false -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid= -checklinkname=0" -v ./main
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          mv xray ../app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Build SingTUN Bridge from Source
        run: |
          bash ./third_party/sing-tun/build.sh
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}

      - name: Test and Build simpletun
        run: |
          cd third_party/simpletun
          zig build test
          zig build android

      - name: Run Unit Tests
        run: bash ./gradlew testDebugUnitTest

      - name: Set up signing keystore
        run: |
          [ -n "${{ secrets.SIGNING_KEY }}" ] || { echo "SIGNING_KEY secret is not set" >&2; exit 1; }
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks

      - name: Build release APK
        run: bash ./gradlew assembleRelease -x lint -PappVerName="${{ env.RELEASE_VERSION }}"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/simplexray-arm64-v8a.apk SimpleXray-arm64-v8a-${{ env.RELEASE_VERSION }}.apk

      - name: Build release APK without GEO resources
        run: |
          bash ./gradlew clean assembleRelease -x lint -PnoGeo=true -PappVerName="${{ env.RELEASE_VERSION }}"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare no-GEO release file
        run: |
          cp app/build/outputs/apk/release/simplexray-arm64-v8a.apk SimpleXray-arm64-v8a-NoGEO-${{ env.RELEASE_VERSION }}.apk

      - name: Generate release notes
        shell: bash
        run: |
          CURRENT_TAG="${RELEASE_VERSION}"
          # No previous tag on first release: grep exits 1 on no match, which
          # pipefail turns into a step failure. `|| true` keeps PREV_TAG empty
          # so the script falls back to a single-tag range.
          PREV_TAG="$(git tag --sort=-v:refname | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)"
          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="$PREV_TAG...$CURRENT_TAG"
          fi
          bash .github/scripts/gen_release_notes.sh -r "$RANGE" -o release.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          draft: true
          generate_release_notes: false
          body_path: release.md
          files: |
            SimpleXray-arm64-v8a-${{ env.RELEASE_VERSION }}.apk
            SimpleXray-arm64-v8a-NoGEO-${{ env.RELEASE_VERSION }}.apk
