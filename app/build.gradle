            def propsFile = rootProject.file('store.properties')
            def props = new Properties()
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }

            def ksPath = System.getenv("KEYSTORE_PATH") ?: props.getProperty('storeFile')
            if (ksPath) {
                storeFile = file(ksPath)
                storePassword = System.getenv("KEYSTORE_PASSWORD") ?: props.getProperty('storePassword') ?: ""
                keyAlias = System.getenv("KEY_ALIAS") ?: props.getProperty('keyAlias') ?: ""
                keyPassword = System.getenv("KEY_PASSWORD") ?: props.getProperty('keyPassword') ?: ""
            }

            enableV1Signing = false
            enableV2Signing = false
            enableV3Signing = true
            enableV4Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) ? signingConfigs.release : signingConfigs.debug
            
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
        debug {
            minifyEnabled = false
