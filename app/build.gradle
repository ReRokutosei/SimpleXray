def versionProps = new Properties()
file("$rootDir/version.properties").withInputStream { versionProps.load(it) }

android {
    namespace = "com.simplexray.an"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.simplexray.an"
        versionCode = versionProps.APP_VERSION_CODE.toInteger()
        versionName = versionProps.APP_VERSION_NAME
        externalNativeBuild {
            ndkBuild {
                arguments "APP_CFLAGS+=-DPKGNAME=com/simplexray/an/service -ffile-prefix-map=${rootDir}=."
                arguments "APP_LDFLAGS+=-Wl,--build-id=none"
            }
        }
        targetSdk = 36
        minSdk = 29
    }

    signingConfigs {
        release {
            enableV1Signing = false
            enableV2Signing = false
            enableV3Signing = true
        }
    }

    def isSigningEnabled = false
    def propsFile = rootProject.file('store.properties')

    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        if (props.containsKey('storeFile')) {
            signingConfigs.release {
                storeFile = rootProject.file(props['storeFile'])
                storePassword = props['storePassword']
                keyAlias = props['keyAlias']
                keyPassword = props['keyPassword']

                enableV1Signing = false
                enableV2Signing = false
                enableV3Signing = true
            }
            isSigningEnabled = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = isSigningEnabled ? signingConfigs.release : null
            
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
        debug {
            minifyEnabled = false
            signingConfig = isSigningEnabled ? signingConfigs.release : null
            debuggable = true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    lintOptions {
        checkReleaseBuilds = false
        abortOnError = false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    ndkVersion = versionProps.NDK_VERSION
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    splits {
        abi {
            enable = true
            reset()
            include "arm64-v8a"
            universalApk = false
        }
    }

    androidComponents {
        onVariants(selector().all(), { variant ->
            variant.outputs.forEach { output ->
                def abiFilter = output.filters.find { it.filterType == 'ABI' }?.identifier
                if (abiFilter != null) {
                    output.outputFileName.set("simplexray-${abiFilter}.apk")
                } else {
                    output.outputFileName.set("simplexray-universal.apk")
                }
            }
        })
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', 'build/generated/source/proto/main/java'
            }
            kotlin {
                srcDirs 'src/main/kotlin', 'build/generated/source/proto/main/grpckt'
            }
        }
    }
}

dependencies {
    implementation libs.grpc.okhttp
    implementation libs.grpc.protobuf
    implementation libs.grpc.stub
    implementation libs.grpc.kotlin.stub

    implementation libs.material
    implementation libs.gson
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.core.ktx

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.runtime.livedata
    implementation libs.androidx.navigation.compose

    implementation libs.lazycolumnscrollbar
    implementation libs.reorderable
    implementation libs.okhttp
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
