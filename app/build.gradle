def computeVersionCode(String versionName) {
    def parts = versionName.split('-')[0].split('\\.')
    def major = parts.size() > 0 ? (parts[0].isInteger() ? parts[0].toInteger() : 1) : 1
    def minor = parts.size() > 1 ? (parts[1].isInteger() ? parts[1].toInteger() : 0) : 0
    def patch = parts.size() > 2 ? (parts[2].isInteger() ? parts[2].toInteger() : 0) : 0
    return major * 10000 + minor * 100 + patch
}

