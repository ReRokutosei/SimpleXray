[versions]
agp = "9.3.1"
kotlin = "2.4.10"
kotlinxSerializationJson = "1.11.0"
protobufPlugin = "0.10.0"
gradleVersionsPlugin = "0.61.0"
protoc = "3.25.9"
grpc = "1.83.1"
grpcGenJava = "1.83.1"
grpcKotlin = "1.5.0"
material = "1.12.0"
datastorePreferences = "1.2.1"
coreKtx = "1.19.0"
composeBom = "2026.08.00"
navigationCompose = "2.9.8"
navigationevent = "1.1.2"
lazyColumnScrollbar = "2.2.0"
reorderable = "3.1.0"
okhttp = "4.12.0"
junit = "4.13.2"
orgJson = "20231013"

[libraries]
# Plugins for buildscript
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Protobuf & gRPC
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protoc" }
grpc-gen-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpcGenJava" }
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }

# AndroidX & Material
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

# Compose
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview-android" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose-android", version.ref = "navigationCompose" }
androidx-navigationevent = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" }

# UI Components & Networking
lazycolumnscrollbar = { module = "com.github.nanihadesuka:LazyColumnScrollbar", version.ref = "lazyColumnScrollbar" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
yaml = { module = "org.yaml:snakeyaml", version = "2.6" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

# MIUIX Components
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur" }
miuix-squircle = { module = "top.yukonga.miuix.kmp:miuix-squircle" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons" }
miuix-nav = { module = "top.yukonga.miuix.kmp:miuix-nav" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
versions = { id = "com.github.ben-manes.versions", version.ref = "gradleVersionsPlugin" }
